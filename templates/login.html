{% extends 'base.html' %}
{% block title %}Login - Smart Hostel Allocation System{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="bg-navy p-4 text-center text-white" style="background-color: var(--navy-sidebar) !important;">
                    <div class="rounded-circle bg-primary bg-opacity-25 text-white d-inline-flex align-items-center justify-content-center mb-2" style="width: 54px; height: 54px;">
                        <i class="fa-solid fa-lock fs-4 text-info"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Welcome Back</h4>
                    <p class="text-white-50 small mb-0">Sign in to Smart Hostel Allocation System</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <!-- Quick Autofill Pills for Demo -->
                    <div class="mb-4 text-center">
                        <small class="text-muted d-block mb-2 fw-semibold">Click to Autofill Demo Credentials:</small>
                        <div class="d-flex justify-content-center gap-2">
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="fillCreds('admin', 'admin123')">
                                <i class="fa-solid fa-shield-halved me-1"></i> Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="fillCreds('warden_boys', 'warden123')">
                                <i class="fa-solid fa-user-tie me-1"></i> Warden
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCreds('rahul_sharma', 'student123')">
                                <i class="fa-solid fa-graduation-cap me-1"></i> Student
                            </button>
                        </div>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small">Username or Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Enter username or email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-key"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label small text-muted" for="remember">
                                    Remember me
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In to Portal
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top">
                        <p class="text-muted small mb-0">
                            New student? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(username, password) {
    document.getElementById('username').value = username;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
